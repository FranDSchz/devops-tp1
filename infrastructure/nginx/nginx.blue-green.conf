resolver 127.0.0.11 valid=10s ipv6=off;

upstream blue_api {
    zone blue_api_zone 64k;
    server blue-api-1:3000 max_fails=1 fail_timeout=10s resolve;
    server blue-api-2:3000 max_fails=1 fail_timeout=10s resolve;
    server blue-api-3:3000 max_fails=1 fail_timeout=10s resolve;
}

upstream blue_web {
    zone blue_web_zone 64k;
    server blue-web-1:80 max_fails=1 fail_timeout=10s resolve;
    server blue-web-2:80 max_fails=1 fail_timeout=10s resolve;
    server blue-web-3:80 max_fails=1 fail_timeout=10s resolve;
}

upstream green_api {
    zone green_api_zone 64k;
    server green-api-1:3000 max_fails=1 fail_timeout=10s resolve;
    server green-api-2:3000 max_fails=1 fail_timeout=10s resolve;
    server green-api-3:3000 max_fails=1 fail_timeout=10s resolve;
}

upstream green_web {
    zone green_web_zone 64k;
    server green-web-1:80 max_fails=1 fail_timeout=10s resolve;
    server green-web-2:80 max_fails=1 fail_timeout=10s resolve;
    server green-web-3:80 max_fails=1 fail_timeout=10s resolve;
}

include /etc/nginx/active/env.conf;
