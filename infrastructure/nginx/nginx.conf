resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
    zone web_upstream_zone 64k;
    server web-1:80 max_fails=1 fail_timeout=10s resolve;
    server web-2:80 max_fails=1 fail_timeout=10s resolve;
    server web-3:80 max_fails=1 fail_timeout=10s resolve;
}

upstream api_upstream {
    zone api_upstream_zone 64k;
    server api-1:3000 max_fails=1 fail_timeout=10s resolve;
    server api-2:3000 max_fails=1 fail_timeout=10s resolve;
    server api-3:3000 max_fails=1 fail_timeout=10s resolve;
}

server {
    listen 80;
    proxy_next_upstream error timeout http_502;
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;
    proxy_pass_header X-Instance-ID;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
    }

    location = /instance.json {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
