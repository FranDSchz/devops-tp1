upstream web_upstream {
    server web-1:80 max_fails=1 fail_timeout=10s;
    server web-2:80 max_fails=1 fail_timeout=10s;
    server web-3:80 max_fails=1 fail_timeout=10s;
}

upstream api_upstream {
    server api-1:3000 max_fails=1 fail_timeout=10s;
    server api-2:3000 max_fails=1 fail_timeout=10s;
    server api-3:3000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Gzip para optimizar transferencia de estáticos en la nube
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    proxy_pass_header X-Instance-ID;
    proxy_next_upstream error timeout http_502;
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 3s;

    # Enrutamiento de la API
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Diagnóstico y healthcheck expuestos a través del proxy
    location /health {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /whoami {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Diagnóstico de réplica frontend (deshabilita caché para rotación Round-Robin en navegadores)
    location = /instance.json {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }

    # Aplicación Web Frontend (SPA)
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
