resolver 127.0.0.11 valid=2s ipv6=off;
upstream race_api_a {
    zone race_api_a 64k;
    server api-a:3000 resolve;
}
upstream race_api_b {
    zone race_api_b 64k;
    server api-b:3000 resolve;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    location / { try_files $uri $uri/ =404; }
    location /a/ {
        proxy_pass http://race_api_a/;
        proxy_read_timeout 10s;
        proxy_pass_header X-Instance-ID;
    }
    location /b/ {
        proxy_pass http://race_api_b/;
        proxy_read_timeout 10s;
        proxy_pass_header X-Instance-ID;
    }
}
