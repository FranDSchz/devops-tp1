services:
  redis:
    image: redis:7-alpine
    container_name: opsboard-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-1:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: opsboard-api-1
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      INSTANCE_ID: api-1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  api-2:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: opsboard-api-2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      INSTANCE_ID: api-2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  api-3:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: opsboard-api-3
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      INSTANCE_ID: api-3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  web-1:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: opsboard-web-1
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - frontend
    restart: unless-stopped

  web-2:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: opsboard-web-2
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - frontend
    restart: unless-stopped

  web-3:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: opsboard-web-3
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: opsboard-nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-1
      - web-2
      - web-3
      - api-1
      - api-2
      - api-3
    networks:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis-data:

networks:
  frontend:
  backend:
