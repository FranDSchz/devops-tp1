services:
  redis:
    image: redis:7-alpine
    container_name: opsboard-cloud-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-cloud-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/frandschz/opsboard-api:latest
    container_name: opsboard-cloud-api
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      INSTANCE_ID: api-cloud-1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  web:
    image: ghcr.io/frandschz/opsboard-web:latest
    container_name: opsboard-cloud-web
    depends_on:
      - api
    networks:
      - frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: opsboard-cloud-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.cloud.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis-cloud-data:

networks:
  frontend:
  backend:
