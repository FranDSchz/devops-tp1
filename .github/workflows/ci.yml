name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build applications
        run: npm run build

  docker-build-check:
    name: Verify Docker Images Build
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: opsboard-api:ci-check

      - name: Build Web Docker image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: opsboard-web:ci-check

  concurrency-demo:
    name: Verify concurrent assignment with real Redis
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Start two API containers and Redis
        run: docker compose -f infrastructure/compose/docker-compose.race-demo.yml up -d --build --wait
      - name: Compare vulnerable and protected assignment
        run: docker compose -f infrastructure/compose/docker-compose.race-demo.yml run --rm demo
      - name: Collect service logs
        if: failure()
        run: docker compose -f infrastructure/compose/docker-compose.race-demo.yml logs --tail 100
      - name: Stop demo
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.race-demo.yml down
